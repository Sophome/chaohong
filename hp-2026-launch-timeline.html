<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>惠普笔记本 2026 新品发布年表</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1c2024; --ink2:#5b6470; --ink3:#8b949e;
    --line:#e6e9ee; --accent:#0096d6; --accent-soft:#e5f4fc;
    --ok:#0f7b53; --ok-soft:#e6f4ee; --warn:#a86400; --warn-soft:#fdf1de;
    --idle:#6b7280; --idle-soft:#eef0f3; --purple:#6b4fd8; --purple-soft:#ede9fb; --teal:#0d7a72; --teal-soft:#e3f2f0;
    --radius:14px; --shadow:0 1px 2px rgba(20,30,45,.05), 0 8px 24px rgba(20,30,45,.05);
    /* 模块间距：改这三处即可整体收紧 / 放开 */
    --gap-block:34px;   /* 关键卡 → 时间轴，月度分组之间 */
    --gap-sec:40px;     /* 时间轴 → 分区标题 */
    --gap-foot:48px;    /* 内容 → 页脚 */
  }
  html[data-theme="dark"]{
    --bg:#14171b; --card:#1c2024; --ink:#e8eaed; --ink2:#a8b0ba; --ink3:#7a838e;
    --line:#2a2f36; --accent:#5cc4ee; --accent-soft:#12303c;
    --ok:#4ec08a; --ok-soft:#173026; --warn:#e0a952; --warn-soft:#322715; --idle:#8b949e; --idle-soft:#252a31;
    --purple:#a694f5; --purple-soft:#251f3d; --teal:#5cc2b8; --teal-soft:#12302e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 24px 64px}

  header{padding:20px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sqd{display:inline-flex;gap:3px}
  .sqd i{width:7px;height:7px;border-radius:2px;display:block;border:1px solid rgba(120,120,140,.25)}
  .sqd i:nth-child(1){background:#0096d6}
  .sqd i:nth-child(2){background:#e2231a}
  .sqd i:nth-child(3){background:#1c2024}
  h1{margin:0;font-size:31px;letter-spacing:-.01em;font-weight:700}
  .sub{margin:8px 0 0;color:var(--ink2);font-size:14px}
  .badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;vertical-align:middle}

  .keybar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:var(--gap-block)}
  .keycard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .keycard .k{font-size:11px;letter-spacing:.1em;color:var(--ink3)}
  .keycard .v{margin-top:6px;font-size:14px;font-weight:600;line-height:1.5}
  .keycard .s{margin-top:8px;display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}

  /* 间距层级：月度分组之间 --gap-block，组内条目之间 12px */
  .month{margin-bottom:var(--gap-block)}
  .month:last-child{margin-bottom:0}
  .mhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .mnum{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .mlabel{font-size:13px;color:var(--ink2)}
  .mmeta{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}

  .tl{position:relative;padding-left:104px}
  .tl::before{content:"";position:absolute;left:88px;top:6px;bottom:6px;width:1px;background:var(--line)}
  .item{position:relative;margin-bottom:12px}
  .item:last-child{margin-bottom:0}
  .item .time{position:absolute;left:-104px;top:14px;width:76px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .item .time small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
  .item .dot{position:absolute;left:-20px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
  .item .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;box-shadow:var(--shadow)}
  .item .t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .tag.pu{background:var(--purple-soft);color:var(--purple)}
  .tag.te{background:var(--teal-soft);color:var(--teal)}
  .tag.id{background:var(--idle-soft);color:var(--idle)}
  .tag.wa{background:var(--warn-soft);color:var(--warn)}
  .item .d{margin-top:6px;font-size:13px;color:var(--ink2)}
  .item .p{margin-top:8px;font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:7px}
  .item .p b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .item.next .dot{background:var(--warn)}

  .sec{margin-top:var(--gap-sec)}
  .sec h2{font-size:13px;letter-spacing:.12em;color:var(--ink3);font-weight:600;margin:0 0 12px}
  .plain{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .plain ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
  .plain li{margin-bottom:7px}
  .plain li:last-child{margin-bottom:0}
  .plain li b{color:var(--ink);font-weight:600}

  footer{margin-top:var(--gap-foot);padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .brandnav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;padding-right:52px}
  .brandnav a{font-size:12px;line-height:1;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink3);text-decoration:none;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
  .brandnav a:hover{color:var(--ink);border-color:var(--accent)}
  .brandnav a.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .toggle{position:fixed;right:16px;top:16px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;font-size:16px;box-shadow:var(--shadow)}

  @media (max-width:680px){
    :root{--gap-block:28px; --gap-sec:32px; --gap-foot:36px}
    .wrap{padding:18px 14px 56px}
    h1{font-size:23px}
    .tl{padding-left:0}
    .tl::before{left:5px}
    .item{padding-left:24px}
    .item .time{position:static;width:auto;text-align:left;margin-bottom:4px}
    .item .time small{display:inline;margin-left:6px}
    .item .dot{left:1px;top:8px}
    .mmeta{margin-left:0}
    .brandnav{flex-wrap:nowrap;overflow-x:auto;padding-right:56px;scrollbar-width:none}
    .brandnav::-webkit-scrollbar{display:none}
    .keybar{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff}
    .toggle{display:none}
    .brandnav{display:none}
    .wrap{max-width:none;padding:0}
    .keycard,.item .card,.plain{box-shadow:none;break-inside:avoid}
    .item,.month{break-inside:avoid}
    .month,.sec{margin-bottom:18px}
  }
</style>
</head>

/* ═══════════════════════════════════════════════════
   渲染逻辑
   ═══════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('eyebrow').textContent  = PAGE.eyebrow;
$('title').textContent    = PAGE.title;
$('badge').textContent    = PAGE.badge;
$('subtitle').textContent = PAGE.subtitle;
$('footL').textContent    = PAGE.footL;

$('keybar').innerHTML = PAGE.keyInfo.map(x => `
  <div class="keycard">
    <div class="k">${esc(x.k)}</div>
    <div class="v">${esc(x.v)}</div>
    <span class="s">${esc(x.s)}</span>
  </div>`).join('');

$('months').innerHTML = PAGE.months.map(mo => `
  <section class="month">
    <div class="mhead">
      <span class="mnum">${esc(mo.m)}</span>
      <span class="mlabel">${esc(mo.label)}</span>
      <span class="mmeta">${esc(mo.meta || '')}</span>
    </div>
    <div class="tl">
      ${mo.items.map(it => `
        <div class="item ${it.next ? 'next' : ''}">
          <div class="time">${esc(it.time)}</div>
          <div class="dot"></div>
          <div class="card">
            <div class="t">
              ${esc(it.title)}
              <span class="tag ${it.tag}">${esc(it.tagText)}</span>
              <span class="tag id">${esc(it.st)}</span>
            </div>
            <div class="d">${it.desc}</div>
            <div class="p">${it.price}</div>
          </div>
        </div>`).join('')}
    </div>
  </section>`).join('');

$('overseas').innerHTML = PAGE.overseas.map(x => `<li>${x}</li>`).join('');

$('tg').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
</script>
