/* ═══════════════════════════════════════════════════
   渲染逻辑
   ═══════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('eyebrow').textContent  = PAGE.eyebrow;
$('title').textContent    = PAGE.title;
$('badge').textContent    = PAGE.badge;
$('subtitle').textContent = PAGE.subtitle;
$('footL').textContent    = PAGE.footL;

$('keybar').innerHTML = PAGE.keyInfo.map(x => `
  <div class="keycard">
    <div class="k">${esc(x.k)}</div>
    <div class="v">${esc(x.v)}</div>
    <span class="s">${esc(x.s)}</span>
  </div>`).join('');

$('months').innerHTML = PAGE.months.map(mo => `
  <section class="month">
    <div class="mhead">
      <span class="mnum">${esc(mo.m)}</span>
      <span class="mlabel">${esc(mo.label)}</span>
      <span class="mmeta">${esc(mo.meta || '')}</span>
    </div>
    <div class="tl">
      ${mo.items.map(it => `
        <div class="item ${it.next ? 'next' : ''}">
          <div class="time">${esc(it.time)}</div>
          <div class="dot"></div>
          <div class="card">
            <div class="t">
              ${esc(it.title)}
              <span class="tag ${it.tag}">${esc(it.tagText)}</span>
              <span class="tag id">${esc(it.st)}</span>
            </div>
            <div class="d">${it.desc}</div>
            <div class="p">${it.price}</div>
          </div>
        </div>`).join('')}
    </div>
  </section>`).join('');

$('overseas').innerHTML = PAGE.overseas.map(x => `<li>${x}</li>`).join('');

$('tg').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
</script>
</body>
</html>
